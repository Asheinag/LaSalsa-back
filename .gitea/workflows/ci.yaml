name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # ВАЖНО: Запускаем шаги внутри контейнера, чтобы работала сеть между сервисами
    container:
      image: catthehacker/ubuntu:act-22.04 

    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        # Явно пробрасываем порты, чтобы они были доступны внутри сети контейнера
        ports:
          - 5432:5432
      
      redis-test:
        image: redis:7.2
        ports:
          - 6379:6379

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        # Внутри контейнера этот флаг может быть критичен
        with:
          set-safe-directory: true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff - format Check
        run: ruff format -- check .
      
      - name: Network Diagnostic
        env:
          DB_HOST: db-test
          REDIS_HOST: redis-test
        run: |
          echo "=== Проверка резолвинга имен (DNS) ==="
          getent hosts $DB_HOST || echo "❌ Не удалось найти IP для $DB_HOST"
          getent hosts $REDIS_HOST || echo "❌ Не удалось найти IP для $REDIS_HOST"
          
          echo "=== Проверка доступности портов (Netcat) ==="
          # Проверяем Postgres (порт 5432)
          nc -zv $DB_HOST 5432 && echo "✅ Postgres доступен!" || echo "❌ Postgres НЕ отвечает"
          
          # Проверяем Redis (порт 6379)
          nc -zv $REDIS_HOST 6379 && echo "✅ Redis доступен!" || echo "❌ Redis НЕ отвечает"
          
          echo "=== Проверка через Localhost (на случай режима host) ==="
          nc -zv 127.0.0.1 5432 && echo "✅ Postgres доступен на localhost!" || echo "❌ На localhost Postgres нет"