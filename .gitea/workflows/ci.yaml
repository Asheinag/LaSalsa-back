name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # ВАЖНО: Запускаем шаги внутри контейнера, чтобы работала сеть между сервисами
    container:
      image: catthehacker/ubuntu:act-22.04 

    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        # Для Postgres внутри Docker-сети порты наружу выставлять не обязательно
      
      redis-test:
        image: redis:7.2

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        # Внутри контейнера этот флаг может быть критичен
        with:
          set-safe-directory: true

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Tests
        env:
          CI: "true"
          DB_HOST: db-test
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: test_db
          CELERY_BROKER_URL: redis://redis-test:6379/0
          CELERY_RESULT_BACKEND: redis://redis-test:6379/0
        run: |
          pytest