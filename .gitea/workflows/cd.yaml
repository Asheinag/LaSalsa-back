name: Deploy La Salsa
on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST  }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/lasalsa-app
            # 1. Забираем актуальные файлы (Docker-конфиги, Nginx-конфиги)
            git pull origin main

            # 2. Формируем актуальные секреты под этот код
            cat <<EOF > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            LASALSA_DB_USER=${{ secrets.LASALSA_DB_USER }}
            LASALSA_DB_PASSWORD='${{ secrets.LASALSA_DB_PASSWORD }}'
            LASALSA_DB_NAME=${{ secrets.LASALSA_DB_NAME }}
            EOF

            # 3. Поднимаем всё на свежем коде и свежих секретах
            docker compose -f docker-compose.prod.yml up -d --build
