services:
  lasalsa-redis:
    image: redis:7.2-alpine
    container_name: lasalsa-redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 100M

  lasalsa-backend:
    build: .
    container_name: lasalsa-backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${LASALSA_DB_USER}
      - DB_PASS=${LASALSA_DB_PASSWORD}
      - DB_NAME=${LASALSA_DB_NAME}
      - DB_SCHEMA=lasalsa
      - RUN_MIGRATIONS=true
      - CELERY_BROKER_URL=redis://lasalsa-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://lasalsa-redis:6379/0
    depends_on:
      - lasalsa-redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  lasalsa-worker:
    build: .
    container_name: lasalsa-worker
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${LASALSA_DB_USER}
      - DB_PASS=${LASALSA_DB_PASSWORD}
      - DB_NAME=${LASALSA_DB_NAME}
      - DB_SCHEMA=lasalsa
      - RUN_MIGRATIONS=false  # Воркеру миграции не нужны
      - CELERY_BROKER_URL=redis://lasalsa-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://lasalsa-redis:6379/0
    depends_on:
      - lasalsa-redis
    command: celery -A app.celery_app.celery_app worker --concurrency=2 --loglevel=info

  lasalsa-nginx:
    image: nginx:stable-alpine
    container_name: lasalsa-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - lasalsa-backend
  
  lasalsa-certbot:
    image: certbot/certbot
    container_name: lasalsa-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot