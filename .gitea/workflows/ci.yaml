name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest

    # Поднимаем временную базу Postgres специально для этого теста
    services:
      db-test: # Это имя станет хостом (DB_HOST) для контейнера с тестами
        image: postgres:14
        env:
          POSTGRES_USER: gitea_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx sqlalchemy asyncpg psycopg2-binary

      - name: Run Tests
        env:
          # Сообщаем тестам, куда подключаться.
          # Хост "db-test" соответствует имени сервиса выше.
          CI: "true"
          DB_HOST: db-test
          DB_PORT: 5432
          DB_USER: gitea_user
          DB_PASS: test_password
          DB_NAME: test_db
        run: |
          pytest
