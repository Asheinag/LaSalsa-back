[project]
name = "lasalsa-back"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.136.1",
    "firebase-admin>=7.4.0",
    "gunicorn>=21.0.0",
    "httpx>=0.28.1",
    "openai>=2.35.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "N", "UP", "ANN", "ASYNC"]
ignore = [
    "E501",   # line too long
    "COM812", # Trailing comma missing (отключаем везде)
    "ISC001", # Implicit string concatenation (рекомендация для форматтера)
    "UP042",  # Implicit string concatenation (рекомендация для форматтера)
]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
"tests/*" = ["S101", "PLR2004", "ANN001", "ANN201", "ANN202",]
"alembic/env.py" = ["ANN001", "ANN201", "ANN202",] 

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
