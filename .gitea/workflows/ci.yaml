name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # ВАЖНО: Запускаем шаги внутри контейнера, чтобы работала сеть между сервисами
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5444:5433 # Меняем на 5444

      redis-test:
        image: redis:7.2
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Docker Health Check
        run: |
          echo "=== Какие контейнеры сейчас запущены? ==="
          docker ps
          echo "=== Логи Postgres (посмотрим, почему он не отвечает) ==="
          # Ищем контейнер с postgres и выводим последние 20 строк логов
          docker logs $(docker ps -q --filter ancestor=postgres:16) || echo "Контейнер не найден"

      - name: Network Scan Script
        run: |
          python3 -c "
          import socket
          import time

          def check_port(name, host, port):
              print(f'--- Checking {name} on {host}:{port} ---')
              for i in range(10):
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print(f'✅ {name} IS REACHABLE!')
                          return True
                  except Exception as e:
                      print(f'Attempt {i+1}: {name} not ready... ({e})')
                      time.sleep(3)
              return False

          db_ok = check_port('Postgres-Test', '127.0.0.1', 5444)
          redis_ok = check_port('Redis-Test', '127.0.0.1', 6379)

          if not (db_ok and redis_ok):
              exit(1)
          "