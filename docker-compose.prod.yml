services:
  lasalsa-redis:
    image: redis:7.2-alpine
    container_name: lasalsa-redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 100M

  lasalsa-backend:
    build: .
    container_name: lasalsa-backend
    restart: always
    volumes:
      - ./certs/firebase_key.json:/app/certs/firebase_key.json:ro
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${LASALSA_DB_USER}
      - DB_PASS=${LASALSA_DB_PASSWORD}
      - DB_NAME=${LASALSA_DB_NAME}
      - DB_SCHEMA=lasalsa
      - RUN_MIGRATIONS=true
      - CELERY_BROKER_URL=redis://lasalsa-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://lasalsa-redis:6379/0
      - SERVICE_ACCOUNT_KEY_PATH=/app/certs/firebase_key.json
    depends_on:
      - lasalsa-redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  lasalsa-worker:
    build: .
    container_name: lasalsa-worker
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${LASALSA_DB_USER}
      - DB_PASS=${LASALSA_DB_PASSWORD}
      - DB_NAME=${LASALSA_DB_NAME}
      - DB_SCHEMA=lasalsa
      - RUN_MIGRATIONS=false # Воркеру миграции не нужны
      - CELERY_BROKER_URL=redis://lasalsa-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://lasalsa-redis:6379/0
    depends_on:
      - lasalsa-redis
    command: celery -A app.celery_app.celery_app worker --concurrency=2 --loglevel=info

  lasalsa-nginx:
    image: nginx:1.27-alpine # Используем стабильный легкий образ
    container_name: lasalsa-nginx
    restart: always
    ports:
      - "80:80" # Для HTTP и проверок Certbot
      - "443:443" # Для защищенного HTTPS
    volumes:
      # 1. Твой конфиг (прокидываем всю папку conf.d как "только чтение")
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 2. Папка с сертификатами (куда их положил Certbot)
      - ./certbot/conf:/etc/letsencrypt:ro
      # 3. Папка для проверок Certbot (чтобы Let's Encrypt видел файлы)
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - lasalsa-backend


  lasalsa-certbot:
    image: certbot/certbot
    container_name: lasalsa-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
