name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # ВАЖНО: Запускаем шаги внутри контейнера, чтобы работала сеть между сервисами
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5439:5432 # Внешний порт 5439, внутренний 5432

      redis-test:
        image: redis:7.2
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Network Scan Script
        run: |
          python3 -c "
          import socket
          import time

          def check_port(name, host, port):
              print(f'--- Checking {name} on {host}:{port} ---')
              for i in range(15):  # Увеличим до 15 попыток (30 сек) для Postgres
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print(f'✅ {name} IS REACHABLE!')
                          return True
                  except Exception as e:
                      print(f'Attempt {i+1}: {name} not ready yet... ({e})')
                      time.sleep(2)
              print(f'❌ {name} IS NOT REACHABLE AFTER ATTEMPTS')
              return False

          # Проверяем наш новый порт 5439
          db_ok = check_port('Postgres-Test', '127.0.0.1', 5439)
          redis_ok = check_port('Redis-Test', '127.0.0.1', 6379)

          if not (db_ok and redis_ok):
              exit(1)
          "