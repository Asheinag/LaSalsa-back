name: Deploy La Salsa
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST  }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/lasalsa-app
            # Создаем .env на лету из секретов
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "LASALSA_DB_USER=${{ secrets.LASALSA_DB_USER }}" >> .env
            echo "LASALSA_DB_PASSWORD='${{ secrets.LASALSA_DB_PASSWORD }}'" >> .env
            echo "LASALSA_DB_NAME=${{ secrets.LASALSA_DB_NAME }}" >> .env
            
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build