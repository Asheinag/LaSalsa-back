name: Deploy La Salsa
on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST  }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/lasalsa-app/backend
            # 1. Обновляем структуру (теперь git pull подтянет изменения в папку backend)
            git pull origin main
            
            # 2. Создаем ключи (путь теперь правильный относительно папки backend)
            mkdir -p ./certs
            cat <<'EOF' > ./certs/firebase_key.json
            ${{ secrets.FIREBASE_KEY }}
            EOF

            # 3. Идем в корень, чтобы запустить docker-compose
            cd ~/lasalsa-app

            # 4. Формируем .env (оставляем в корне)
            cat <<'EOF' > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            LASALSA_DB_USER=${{ secrets.LASALSA_DB_USER }}
            LASALSA_DB_PASSWORD='${{ secrets.LASALSA_DB_PASSWORD }}'
            LASALSA_DB_NAME=${{ secrets.LASALSA_DB_NAME }}
            SERVICE_ACCOUNT_KEY_PATH=/app/certs/firebase_key.json
            ORIGINS=${{ secrets.ORIGINS }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY}}
            LLM_PROJECT=${{ secrets.LLM_PROJECT}}
            LLM_PROMPT_ID=${{ secrets.LLM_PROMPT_ID}}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL}}
            EOF

            # 5. Пересобираем только бэк и воркер, чтобы не трогать лишний раз фронт/nginx
            docker compose -f docker-compose.prod.yml up -d --build lasalsa-backend lasalsa-worker