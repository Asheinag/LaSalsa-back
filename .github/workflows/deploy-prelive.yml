name: Deploy Prelive (backend)

on:
  push:
    branches: [ "test" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-prelive.yml"

permissions:
  contents: read
  packages: write    # для push в GHCR

concurrency:
  group: prelive-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prelive

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/kabachok-club/lasalsa-back
      SHA_TAG: prelive-${{ github.sha }}
      LATEST_TAG: prelive-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend image (SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          # если нужен кэш, можно добавить cache-from/to: type=gha

      - name: Deploy on server via SSH (pull & up & migrate)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/prelive
            # логин в GHCR для pull
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # потянуть свежие теги и поднять только api
            docker pull ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            docker tag  ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }} ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}

            # проверить docker-compose валиден
            docker compose config -q

            # обновить и перезапустить api с новым образом
            docker compose up -d api

            # прогнать миграции (если alembic внутри контейнера)
            docker compose exec -T api alembic upgrade head

            # простые smoke-чекки
            curl -fsSL --max-time 10 https://${API_HOST}/healthz >/dev/null

      - name: Post summary
        if: always()
        run: |
          {
            echo "### Prelive backend deploy"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}\`"
            echo "- Host: https://${{ env.API_HOST || 'api.prelive.lasalsa.kabachok.club' }}"
          } >> $GITHUB_STEP_SUMMARY