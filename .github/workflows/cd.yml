name: Deploy La Salsa
on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 1. Создаем архив с кодом (исключая лишнее)
      - name: Create archive
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='.env' -czf release.tar.gz .

      # 2. Передаем архив и секреты на сервер
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            # Переходим в папку проекта
            cd ~/lasalsa-app
            
            # 3. Создаем файлы с секретами на сервере
            mkdir -p ./backend/certs
            cat <<'EOF' > ./backend/certs/firebase_key.json
            ${{ secrets.FIREBASE_KEY }}
            EOF

            cat <<'EOF' > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            LASALSA_DB_USER=${{ secrets.LASALSA_DB_USER }}
            LASALSA_DB_PASSWORD='${{ secrets.LASALSA_DB_PASSWORD }}'
            LASALSA_DB_NAME=${{ secrets.LASALSA_DB_NAME }}
            SERVICE_ACCOUNT_KEY_PATH=/app/certs/firebase_key.json
            ORIGINS=${{ secrets.ORIGINS }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY}}
            LLM_PROJECT=${{ secrets.LLM_PROJECT}}
            LLM_PROMPT_ID=${{ secrets.LLM_PROMPT_ID}}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL}}
            EOF

      # 4. Передаем архив с кодом на сервер
      - name: Sync files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LASALSA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.tar.gz"
          target: "~/lasalsa-app"
          strip_components: 0

      # 5. Распаковываем и перезапускаем контейнеры
      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/lasalsa-app
            
            # Распаковываем архив (обновляем файлы)
            tar -xzf release.tar.gz
            
            # Пересобираем и запускаем
            docker compose -f docker-compose.prod.yml up -d --build lasalsa-backend lasalsa-worker
            
            # Чистим за собой
            rm release.tar.gz