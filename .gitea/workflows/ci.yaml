name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing Gitea Actions
on: [pull_request] # Запускать при пуше и создании ПР

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest # Этот лейбл мы прописали в настройках Runner'а
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          # Это заставит использовать системный git внутри контейнера,
          # а не node-скрипт экшена
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio  # Ставим базу
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Linter)
        run: |
          # --select ALL включает вообще все правила, которые есть в Ruff
          # --ignore ... здесь можно добавить исключения, если станет СЛИШКОМ больно
          # --output-format=github интегрирует ошибки в интерфейс (если Gitea поддерживает)
          ruff check .

      - name: Run Ruff Format (Check)
        run: |
          # Проверяем, что код отформатирован правильно
          ruff format --check .

