name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # ВАЖНО: Запускаем шаги внутри контейнера, чтобы работала сеть между сервисами
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5444:5433 # Меняем на 5444

      redis-test:
        image: redis:7.2
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Dynamic Network Discovery
        id: info # Даем ID шагу, чтобы вытащить IP
        run: |
          # Вытаскиваем IP адреса напрямую из Docker
          DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker ps -q --filter ancestor=postgres:16))
          REDIS_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker ps -q --filter ancestor=redis:7.2))
          
          echo "db_ip=$DB_IP" >> $GITEA_OUTPUT
          echo "redis_ip=$REDIS_IP" >> $GITEA_OUTPUT
          
          echo "Найден Postgres IP: $DB_IP"
          echo "Найден Redis IP: $REDIS_IP"

      - name: Diagnostic Scan
        run: |
          python3 -c "
          import socket
          import time

          def check(name, host, port):
              print(f'Checking {name} at {host}:{port}')
              for i in range(15):
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          print(f'✅ {name} подключен!')
                          return True
                  except:
                      time.sleep(2)
              return False

          # Стучимся ВНУТРЬ сети Docker по прямым IP
          if not check('Postgres', '${{ steps.info.outputs.db_ip }}', 5432): exit(1)
          if not check('Redis', '${{ steps.info.outputs.redis_ip }}', 6379): exit(1)
          "