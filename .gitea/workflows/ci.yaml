name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is fixing network
on:
  pull_request:
    branches: [main, development, test]

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    # Мы НЕ используем container: здесь, чтобы быть на хосте

    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        # ВАЖНО: это заставит контейнер открыться на портах хоста напрямую
        options: >-
          --network host

      redis-test:
        image: redis:7.2
        options: >-
          --network host

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Final Connectivity Check
        run: |
          python3 -c "
          import socket
          import time

          def check(name, port):
              print(f'Проверяем {name} на 127.0.0.1:{port}...')
              for i in range(15):
                  try:
                      # ТАК КАК СЕТЬ HOST, СТУЧИМСЯ В СТАНДАРТНЫЕ ПОРТЫ
                      with socket.create_connection(('127.0.0.1', port), timeout=1):
                          print(f'✅ {name} ПОДКЛЮЧЕН!')
                          return True
                  except:
                      time.sleep(2)
              return False

          # В режиме --network host Postgres будет на 5432, Redis на 6379
          db_ok = check('Postgres', 5432)
          redis_ok = check('Redis', 6379)
          
          if not (db_ok and redis_ok):
              print('❌ Стык не удался. Проверяем порты через netstat...')
              import os
              os.system('ss -tulpn')
              exit(1)
          "