name: Gitea Actions CI Pipeline
run-name: ${{ gitea.actor }} is testing Gitea Actions
on:
  pull_request:
    branches:
      - main
      - development
      - test

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest

    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --network host
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-test:
        image: redis:7.2
        options: >-
          --network host
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          # Убедимся, что линтер и форматтер тоже стоят
          pip install ruff pytest pytest-asyncio

      - name: Run Ruff (Linter & Formatter check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        env:
          CI: "true"
          # Используем проверенный 127.0.0.1
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: test_db
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          # Небольшая пауза для уверенности, что БД готова к транзакциям
          sleep 5
          pytest